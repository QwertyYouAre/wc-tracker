# Pings the push poller so followed-team alerts go out even when no one has the
# site open. GitHub's scheduler floors `schedule` at ~5 min and is best-effort,
# which is fine for kick-off and full-time. For snappier in-match GOAL alerts,
# use cron-job.org at 1-minute instead (see SETUP-NOTIFICATIONS.md) — both can
# run together harmlessly.
name: notify-cron

on:
  schedule:
    - cron: '*/5 * * * *' # every ~5 minutes (GitHub minimum)
  workflow_dispatch: {}     # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the notify endpoint
        run: |
          curl -fsS -X POST "https://wctracker2026.vercel.app/api/notify-cron" \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "notify-cron HTTP %{http_code}\n"
